# 装到 /etc/nginx/sites-available/voc-board 并 ln 到 sites-enabled/
#
#   sudo install -m 0644 nginx-conf.d-voc-http.conf   /etc/nginx/conf.d/voc-http.conf
#   sudo install -m 0644 nginx-sites-voc-board.conf   /etc/nginx/sites-available/voc-board
#   sudo ln -sfn /etc/nginx/sites-available/voc-board /etc/nginx/sites-enabled/voc-board
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 装之前务必先 `sudo nginx -t`。这台 nginx 上还跑着别人的 ipms（8080，server_name _ 通配），
# 配错会把它一起带下去。本文件全程只用 8081，不碰 8080。
#
# 链路：浏览器 → 公司边界设备 voc.ulanzi.com:<伟杰分配的端口> → 172.16.100.122:8081（本文件）
#       → uvicorn 127.0.0.1:8090
#
# 这台机器没有公网 IP，公网入口由伟杰在边界设备上做端口映射。443 用不了，会是一个非标准端口，
# 因此对外地址形如 https://voc.ulanzi.com:12345 —— 这个端口一旦定死就不能改，
# 飞书开放平台登记的登录回调地址里带着它，改端口登录会直接挂。
#
# server_name 只写域名不写端口是对的：nginx 匹配 server_name 时会剥掉 Host 头里的端口。

server {
    # ── TLS 分支 A：边界设备终止 https（首选） ──
    # 这里收到的就是明文 HTTP，不配证书是对的，不是配漏了。
    listen 8081;

    # ── TLS 分支 B：边界只做纯端口转发，由本机终止 https ──
    # 若伟杰给的是 *.ulanzi.com 证书，改用下面三行替换上面的 listen：
    #   listen 8081 ssl;
    #   ssl_certificate     /etc/ssl/voc/fullchain.pem;
    #   ssl_certificate_key /etc/ssl/voc/privkey.pem;   # 0600 root:root
    # 并把 secrets.env 里的 VOC_PUBLIC_BASE_URLS 写成 https://voc.ulanzi.com:<端口>
    #
    # ⚠️ 两个分支都不接受的第三种情况：明文 HTTP 直接对公网。
    # 登录会话 cookie 在明文链路上可被旁路嗅探，等于登录门形同虚设。
    # 若最终只能明文，必须先降级为「仅 tailnet 访问」，不要上公网。

    server_name voc.ulanzi.com;

    # 访问日志单独一份，别和 ipms 混在 access.log 里。
    # 公网化之后「谁在什么时候看了哪个 SPU」是要能查的。
    access_log /var/log/nginx/voc-board.access.log;
    error_log  /var/log/nginx/voc-board.error.log;

    client_max_body_size 1m;

    # 探活。不进限流、不记日志，否则边界每几秒探一次会把日志刷满。
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $http_host;
    }

    # 登录入口限流，突发放行 5 个（一次跳转 + 回调 + 用户手抖重试的余量）。
    # 这是唯一免鉴权的写入面，不限流等于给飞书接口开了个放大器。
    location /auth/ {
        limit_req zone=voc_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $voc_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # 这四个头一个都不能少，应用靠它们还原用户看到的地址来拼飞书回调。
        # $http_host 带端口，正好是非标准端口场景需要的。
        # 改写 Host 会让登录后被扔回错误的地址——这个坑同机的另一个系统实测踩过。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $voc_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # 战略视图和产品检索会跑较重的聚合查询，默认 60s 不够。
        proxy_read_timeout 120s;

        # HTMX 局部刷新全是小响应，关掉缓冲让首字节更快。
        proxy_buffering off;
    }

    # 这是内部商业情报，不进搜索引擎。
    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
