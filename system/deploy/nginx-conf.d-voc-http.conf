# 装到 /etc/nginx/conf.d/voc-http.conf
#
# http 层的两个声明，必须放在 conf.d（先于 sites-enabled 加载），不能塞进 server 块。
#
# ⚠️ 变量名带 voc_ 前缀是刻意的：这台机器上 /etc/nginx/conf.d/ipms-proto.conf
# 已经定义了 $ipms_forwarded_proto，同名会直接冲突导致 nginx 起不来，
# 连带把 ipms 一起打挂。

# 隧道/反代进来时用它带的 x-forwarded-proto；直连（本机调试）时退回实际 scheme。
# 不能写死 https：本机 curl 排查时会拿到错误的回调域名。
map $http_x_forwarded_proto $voc_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 登录入口限流。OAuth 回调和授权跳转是唯一免鉴权的写入面，
# 不限流的话任何人都能拿它当飞书接口的放大器打。
# 10m 约能存 16 万个地址，够用。
limit_req_zone $binary_remote_addr zone=voc_auth:10m rate=10r/m;
