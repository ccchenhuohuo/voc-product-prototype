[project]
name = "voc-opportunity-board"
version = "0.0.1"
description = "VOC 机会看板（FastAPI + Jinja2 + HTMX）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1.5",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
