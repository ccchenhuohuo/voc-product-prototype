<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可点原型</title>
<meta name="description" content="整个系统的交互逻辑，点得动">
<style>
/* VOC 系统设计令牌 · Notion 体系 · 三态主题 */
:root{
  --paper:#fff; --side:#f7f6f3; --sunk:#fbfbfa; --ink:#37352f; --muted:#787774;
  --faint:#9b9a97; --line:#e9e9e7; --line2:#f1f0ee; --accent:#2383e2; --hover:#f1f0ee;
  --g-bg:#e9e9e7; --g-ink:#37352f;
  --b-bg:#d3e5ef; --b-ink:#183347;
  --gr-bg:#dbeddb; --gr-ink:#1c3829;
  --y-bg:#fdecc8; --y-ink:#402c1b;
  --r-bg:#ffe2dd; --r-ink:#5d1715;
  --p-bg:#e8deee; --p-ink:#412454;
  --o-bg:#faebdd; --o-ink:#49290f;
  --spu-edge:#2383e2; --inn-edge:#448361;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#191919; --side:#202020; --sunk:#1c1c1c; --ink:#d3d3d1; --muted:#9b9998;
  --faint:#6f6d6b; --line:#2f2f2f; --line2:#252525; --accent:#529cca; --hover:#252525;
  --g-bg:#373737; --g-ink:#d3d3d1;
  --b-bg:#243d4d; --b-ink:#cfe3f0;
  --gr-bg:#243d30; --gr-ink:#c8e6d0;
  --y-bg:#4a3a1c; --y-ink:#f7e2b5;
  --r-bg:#3d2422; --r-ink:#f3ccc7;
  --p-bg:#372a41; --p-ink:#e2d3ee;
  --o-bg:#3f2c1c; --o-ink:#f2d9bd;
  --spu-edge:#529cca; --inn-edge:#5b9c74;}}
:root[data-theme="dark"]{
  --paper:#191919; --side:#202020; --sunk:#1c1c1c; --ink:#d3d3d1; --muted:#9b9998;
  --faint:#6f6d6b; --line:#2f2f2f; --line2:#252525; --accent:#529cca; --hover:#252525;
  --g-bg:#373737; --g-ink:#d3d3d1;
  --b-bg:#243d4d; --b-ink:#cfe3f0;
  --gr-bg:#243d30; --gr-ink:#c8e6d0;
  --y-bg:#4a3a1c; --y-ink:#f7e2b5;
  --r-bg:#3d2422; --r-ink:#f3ccc7;
  --p-bg:#372a41; --p-ink:#e2d3ee;
  --o-bg:#3f2c1c; --o-ink:#f2d9bd;
  --spu-edge:#529cca; --inn-edge:#5b9c74;}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 状态标签 —— 方角粉彩，Notion 风格 */
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:19px;
  padding:0 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.st-consider{background:var(--g-bg);color:var(--g-ink)}
.st-track{background:var(--b-bg);color:var(--b-ink)}
.st-project{background:var(--p-bg);color:var(--p-ink)}
.st-done{background:var(--gr-bg);color:var(--gr-ink)}
.st-drop{background:var(--g-bg);color:var(--faint)}
.st-revive{background:var(--o-bg);color:var(--o-ink)}
/* 扩散范围 */
.sc{display:inline-block;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;font-weight:600}
.sc-one{background:var(--g-bg);color:var(--muted)}
.sc-multi{background:var(--y-bg);color:var(--y-ink)}
.sc-line{background:var(--r-bg);color:var(--r-ink)}
/* 幽灵按钮 */
.gh{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:26px;padding:0 10px;
  border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--muted);
  cursor:pointer;font-family:inherit;transition:background .12s,color .12s}
.gh:hover{background:var(--hover);color:var(--ink)}
.gh-primary{border-color:transparent;background:var(--accent);color:#fff}
.gh-primary:hover{background:var(--accent);color:#fff;filter:brightness(1.08)}
.gh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 面包屑 */
.crumb{font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.crumb b{color:var(--muted);font-weight:500}
.crumb i{font-style:normal;color:var(--line);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<style>
/* ============================================================
   量具（instrument）· 这不是文档页，是读数仪器
   ------------------------------------------------------------
   界面上八成有效内容是数字，用户是固定的少数人每周重复使用，
   永远不需要说服谁。所以设计预算全给密度与可辨性：
   等宽定宽数字主导 · 可见的细网格 · 近无彩表面 + 单一告警色 ·
   不用圆角阴影 emoji。留白从行内挤出来，全部放到分组之间。
   ============================================================ */
:root{
  /* 表面：冷中性。网格线要画出来——Notion 刻意不画，数据表必须画 */
  --field:#fcfcfd; --row:#ffffff; --alt:#fafafb; --sunk:#f4f4f6;
  --rule:#e4e4e7; --rule-2:#eeeef0; --rule-strong:#c8c8cd;
  /* 墨色四档，对底色全部 ≥4.5:1 */
  --ink:#18181b; --ink-2:#3f3f46; --ink-3:#5c5c66; --ink-4:#71717a;
  /* 色彩预算：一个告警色。没有蓝紫绿粉各来一块 */
  --alarm:#c2321f; --alarm-wash:#fdf2f0; --alarm-dim:#e8b4ab;
  --focus:#2b6cb0;
  /* 拉丁与中文出自同一设计体系：PingFang SC 本就是为搭配 SF 而设计的。
     此前把 Manrope 排在首位，导致拉丁走几何无衬线、中文回退人文黑体，
     同一行里两套毫不相干的字面——那才是「看起来通用」的真正原因。 */
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB',
         'Microsoft YaHei',system-ui,sans-serif;
  --mono:ui-monospace,Menlo,'SF Mono',Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --field:#0f0f11; --row:#151517; --alt:#131315; --sunk:#1c1c1f;
  --rule:#2a2a2e; --rule-2:#232327; --rule-strong:#3f3f46;
  --ink:#f4f4f5; --ink-2:#d4d4d8; --ink-3:#a1a1aa; --ink-4:#8b8b93;
  --alarm:#f2705a; --alarm-wash:#2a1815; --alarm-dim:#7a3a30;
  --focus:#63a4dd;}}
:root[data-theme="dark"]{
  --field:#0f0f11; --row:#151517; --alt:#131315; --sunk:#1c1c1f;
  --rule:#2a2a2e; --rule-2:#232327; --rule-strong:#3f3f46;
  --ink:#f4f4f5; --ink-2:#d4d4d8; --ink-3:#a1a1aa; --ink-4:#8b8b93;
  --alarm:#f2705a; --alarm-wash:#2a1815; --alarm-dim:#7a3a30;
  --focus:#63a4dd;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--field);color:var(--ink);font-family:var(--sans);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

/* ---------- 骨架 ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
.sb{width:186px;flex:0 0 186px;background:var(--field);border-right:1px solid var(--rule);
  padding:16px 0 12px;display:flex;flex-direction:column;overflow-y:auto}
.brand{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);
  padding:0 16px 14px;font-weight:600}
.nav{display:flex;align-items:baseline;gap:8px;width:100%;padding:5px 16px;
  font-size:13px;color:var(--ink-3);text-align:left;border-left:2px solid transparent}
.nav:hover{color:var(--ink);background:var(--sunk)}
.nav.on{color:var(--ink);font-weight:600;border-left-color:var(--ink);background:var(--sunk)}
.nav .nc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
.nav.on .nc{color:var(--ink-3)}
.nav.alarm .nc{color:var(--alarm);font-weight:700}
.sb-gap{height:14px}
.sb-note{margin-top:auto;padding:12px 16px 0;border-top:1px solid var(--rule);
  font-size:11px;color:var(--ink-4);line-height:1.5}
.body{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--row);overflow:hidden}

.head{flex:0 0 auto;padding:18px 26px 0;border-bottom:1px solid var(--rule)}
.trail{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-4);margin-bottom:9px}
.trail button{color:var(--ink-4);padding:1px 3px}
.trail button:hover{color:var(--ink);text-decoration:underline}
.trail i{font-style:normal;color:var(--rule-strong)}
h1{font-size:17px;font-weight:600;margin:0 0 3px;letter-spacing:-.005em}
.lede{font-size:12px;color:var(--ink-3);margin:0 0 13px;max-width:62em;line-height:1.55}
.lede b{color:var(--ink-2);font-weight:600}
.tabs{display:flex;gap:2px;margin-bottom:-1px}
.tab{font-size:12px;padding:6px 11px;color:var(--ink-3);border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-left:5px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 26px 40px;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px;
  border:2px solid var(--row);background-clip:padding-box}

/* ---------- 表 ---------- */
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--row);text-align:left;
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-4);padding:11px 8px 7px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--rule-2)}
tbody tr:hover{background:var(--sunk)}
tbody tr.sel{background:var(--sunk)}
tbody tr.muted{opacity:.42}
tbody tr.flag{background:var(--alarm-wash)}
tbody tr.flag:hover{background:var(--alarm-wash);filter:brightness(.985)}
td{padding:6px 8px;vertical-align:middle}
td.r{text-align:right}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.n-lg{font-family:var(--mono);font-size:13.5px;font-weight:600}
.dim{color:var(--ink-4)}
.nm{font-weight:500;color:var(--ink)}
.code{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.sub{font-size:11px;color:var(--ink-4);margin-top:1px}
.tight{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1px}

/* 状态：3px 竖标 + 墨色 + 透明度。不用六块粉彩 */
td.mark{width:3px;padding:0}
.mk{display:block;width:3px;height:26px}
.mk-todo{background:var(--ink)}
.mk-wip{background:var(--ink-4)}
.mk-rev{background:var(--alarm)}
.mk-none{background:transparent}
.stat{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.stat.rev{color:var(--alarm);font-weight:600}
.stat.off{color:var(--ink-4)}

/* 数字背后的条：共同基线长度，比彩色数字准得多，且不占垂直空间 */
.bar{position:relative;display:inline-block;min-width:52px;text-align:right;padding:0 7px}
.bar::before{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  height:16px;width:calc(var(--w,0) * 1%);background:var(--ink);opacity:.09;border-radius:1px}
.bar.hot::before{background:var(--alarm);opacity:.17}
.bar>span{position:relative}

/* 分组标题 */
.grp{display:flex;align-items:baseline;gap:9px;margin:30px 0 0;padding-bottom:6px}
.grp:first-child{margin-top:16px}
.grp h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.grp .c{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.grp .r{margin-left:auto;font-size:11px;color:var(--ink-4)}

/* 控件：筛选与状态迁移必须长得不一样 */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:11px 0 12px}
.f{font-size:11.5px;padding:2px 9px;color:var(--ink-3);border:1px solid var(--rule);border-radius:11px}
.f:hover{border-color:var(--rule-strong);color:var(--ink)}
.f.on{background:var(--ink);color:var(--row);border-color:var(--ink);font-weight:600}
.f .n2{font-family:var(--mono);opacity:.6;margin-left:4px}
.act{font-size:11.5px;padding:3px 10px;border:1px solid var(--rule-strong);color:var(--ink-2);
  border-radius:2px;font-weight:500}
.act:hover{background:var(--ink);color:var(--row);border-color:var(--ink)}
.act.on{background:var(--ink);color:var(--row);border-color:var(--ink);font-weight:600}
.act.grave{border-color:var(--alarm-dim);color:var(--alarm)}
.act.grave:hover{background:var(--alarm);color:#fff;border-color:var(--alarm)}
.ops{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.ops .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);margin-right:3px}

.form{margin-top:8px;border:1px solid var(--rule-strong);border-radius:2px;padding:11px 13px;background:var(--field);max-width:520px}
.form label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}
.form input,.form textarea{width:100%;border:1px solid var(--rule-strong);border-radius:2px;padding:6px 8px;
  font:inherit;font-size:12.5px;background:var(--row);color:var(--ink);margin-bottom:9px}
.form textarea{resize:vertical;min-height:44px}
.form .fr{display:flex;gap:11px}.form .fr>div{flex:1}
.err{color:var(--alarm);font-size:11.5px;margin:0 0 8px;line-height:1.5}

/* 详情页读数区 */
.readout{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);margin:14px 0 4px}
.ro{padding:9px 15px;border-right:1px solid var(--rule);flex:1 1 auto;min-width:96px}
.ro:last-child{border-right:none}
.ro .v{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.2}
.ro .v.bad{color:var(--alarm)}
.ro .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-top:2px}
.ro .cmp{font-size:10.5px;color:var(--ink-4);margin-top:1px}
.note{font-size:11.5px;color:var(--ink-4);line-height:1.6;border-top:1px solid var(--rule);
  margin-top:22px;padding-top:12px;max-width:70em}
.note b{color:var(--ink-3)}
.flagbox{font-size:11.5px;padding:6px 10px;border-left:2px solid var(--alarm);background:var(--alarm-wash);
  color:var(--ink-2);margin-top:6px;line-height:1.5}
.flagbox.ok{border-left-color:var(--ink-4);background:var(--sunk)}

.voice{padding:10px 0;border-bottom:1px solid var(--rule-2)}
.voice p{margin:0;font-size:13px;line-height:1.6}
.voice .meta{display:flex;gap:10px;margin-top:4px;font-size:11px;color:var(--ink-4)}
.voice .meta .s{font-family:var(--mono);color:var(--ink-3)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-strong);border-radius:2px;
  padding:6px 11px;margin:12px 0 4px;max-width:420px}
.search input{flex:1;border:none;outline:none;background:none;color:var(--ink);font:inherit;font-size:12.5px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);border-radius:2px;
  padding:0 4px;color:var(--ink-4);background:var(--field)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--row);font-size:12px;padding:7px 14px;border-radius:2px;opacity:0;
  transition:opacity .18s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="sb">
    <div class="brand">VOC 机会看板</div>
    <button class="nav" data-go="iter"><span>老品迭代</span><span class="nc" id="c-iter"></span></button>
    <button class="nav" data-go="inno"><span>新品创新</span><span class="nc" id="c-inno"></span></button>
    <button class="nav" data-go="strategy"><span>战略视图</span><span class="nc" id="c-str"></span></button>
    <button class="nav" data-go="search"><span>产品检索</span><span class="nc" id="c-search"></span></button>

      <span class="kbd">J</span> <span class="kbd">K</span> 移动 · <span class="kbd">↵</span> 进入 · <span class="kbd">Esc</span> 返回
    </div>
  </aside>
  <div class="body"><div id="view" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>
</div>

function mark(st){return st==='待复议'?'mk-rev':st==='考虑中'?'mk-todo'
  :(st==='在跟进'||st==='项目中')?'mk-wip':'mk-none';}
const isOff=st=>st==='已完成'||st==='不考虑';

// 排序按负面占比，不是负面绝对值——后者基本是销量的代理变量。

const iterList=()=>[...DB.spus].sort((a,b)=>ratio(b)-ratio(a));
function issueList(spu,issues){
  return [...issues].sort((a,b)=>{

    const da=isOff(ma.status)?1:0,db=isOff(mb.status)?1:0; if(da!==db)return da-db;
    const ra=(ma.revived&&ma.status==='考虑中')?0:1,rb=(mb.revived&&mb.status==='考虑中')?0:1;

    return b.evi_count-a.evi_count;});
}

function setStatus(spu,opp,st){
  const m={...get(spu,opp)},prev=m.status;
  if(st==='不考虑'&&!((S.editing||{}).note||'').trim()){
    S.editing={spu,opp,want:'不考虑'};
    S.err='置为「不考虑」必须填理由。数据库那层会拒绝——前端拦只是提前告诉你，不是替代。';return render();}
  if(st==='已完成'&&!((S.editing||{}).date)){S.editing={spu,opp,want:'已完成'};S.err=null;return render();}
  m.status=st;
  if(st==='不考虑'){m.note=S.editing.note.trim();
    m.baseline=DB.spus.find(s=>s.spu===spu).issues.find(i=>i.opp_id===opp).evi_count;}
  if(st==='已完成'){m.release=S.editing.release||'';m.date=S.editing.date||'';}
  if(st!=='考虑中')m.revived=false;
  manual[key(spu,opp)]=m;S.editing=null;S.err=null;toast(prev+' → '+st);render();
}
function revive(spu,opp){const m={...get(spu,opp)};

  manual[key(spu,opp)]=m;toast('已复活 → 待复议');render();}

      <td><div class="nm">${esc(s.name)}</div><div class="sub"><span class="code">${esc(s.spu)}</span> · ${esc(s.category||'')} · ${esc(s.launch_period||'—')}</div></td>
      <td class="n dim">${esc((s.grade||'').replace('级',''))}</td>
      <td class="r"><span class="n-lg" style="${hot?'color:var(--alarm)':''}">${r.toFixed(1)}</span><span class="dim n" style="font-size:10.5px">%</span></td>
      <td class="r"><span class="bar ${hot?'hot':''}" style="--w:${(s.negative_evi_count/maxNeg*100).toFixed(0)}"><span class="n">${fmt(s.negative_evi_count)}</span></span></td>
      <td class="r n ${s.avg_star<4?'':'dim'}" style="${s.avg_star<4?'color:var(--alarm);font-weight:600':''}">${s.avg_star}</td>
      <td class="r n dim">${backlog(s)}</td>
      <td class="tight"><span style="font-size:12px">${esc(top?top.title:'—')}</span></td>
      <td class="r n ${rec?'':'dim'}">${rec||'·'}</td></tr>`;});
  return h+`</tbody></table></div>`;
}

function viewSpu(){
  const s=DB.spus.find(x=>x.spu===S.spu), list=issueList(s.spu,s.issues);
  const r=ratio(s), maxE=Math.max(...list.map(i=>i.evi_count));
  const med=(DB.spus.map(x=>x.avg_star).sort((a,b)=>a-b)[Math.floor(DB.spus.length/2)]);
  let h=`<div class="head">${trail([{t:'老品迭代',go:'iter'},{t:s.name}])}
    <h1>${esc(s.name)}</h1>
    <p class="lede"><span class="code">${esc(s.spu)}</span> · SKU ${esc((s.skus||[]).join(' / ')||'—')}
      · ${esc(s.category||'')} · ${esc(s.launch_period||'')} · 定级 ${esc(s.grade||'')} · 负责人 <b>未分配</b></p>
    </div><div class="scroll">
    <div class="readout">
      <div class="ro"><div class="v ${r>=20?'bad':''}">${r.toFixed(1)}%</div><div class="k">负面占比</div>
        <div class="cmp">组内中位 13.6%</div></div>
      <div class="ro"><div class="v ${s.avg_star<4?'bad':''}">${s.avg_star}</div><div class="k">均星</div>
        <div class="cmp">组内中位 ${med}</div></div>
      <div class="ro"><div class="v">${fmt(s.message_count)}</div><div class="k">消息</div></div>
      <div class="ro"><div class="v">${fmt(s.negative_evi_count)}</div><div class="k">负面证据</div>
        <div class="cmp">正面 ${fmt(s.positive_evi_count)}</div></div>
      <div class="ro"><div class="v">${backlog(s)}</div><div class="k">待办 / 总条目</div></div>
    </div>
    <div class="grp"><h2>问题条目</h2><span class="c">${list.length}</span>
      <span class="r">已完成沉底 · 复活置顶 · 其余按证据数</span></div>
    <table><thead><tr><th style="width:3px"></th><th>问题</th>
      <th class="r" style="width:86px">证据</th><th class="r" style="width:60px">近60天</th>
      <th class="r" style="width:84px">扩散</th><th style="width:150px">状态</th></tr></thead><tbody>`;
  list.forEach(i=>{
    const m=get(s.spu,i.opp_id), st=shown(m), off=isOff(m.status), rec=trend(s.spu,i.opp_id);
    h+=`<tr class="${off?'muted':''} ${st==='待复议'?'flag':''}">
      <td class="mark"><span class="mk ${mark(st)}"></span></td>
      <td><div class="nm" style="cursor:pointer" data-voices="${esc(i.opp_id)}">${esc(i.title)}</div>
        <div class="sub">${esc(i.d||'')} › ${esc(i.sub||'')}${i.leaf?' › '+esc(i.leaf):''}</div>`;
    if(st==='待复议')h+=`<div class="flagbox">${esc(m.reason||'上市后仍有新反馈')}</div>`;
    if(m.status==='已完成')h+=`<div class="flagbox ok">${esc(m.release||'')} 于 ${esc(m.date||'')} 上市 · 之后 0 条新反馈
      <button style="text-decoration:underline;color:var(--ink-4);margin-left:6px" data-rev="${esc(i.opp_id)}">模拟收到新反馈</button></div>`;
    h+=`<div class="ops"><span class="lbl">状态</span>`;
    FLOW.forEach(f=>{const gr=(f==='不考虑'||f==='已完成');
      h+=`<button class="act ${m.status===f?'on':''} ${gr&&m.status!==f?'grave':''}" data-set="${esc(i.opp_id)}|${f}">${f}</button>`;});
    h+=`</div>`;
    if(S.editing&&S.editing.opp===i.opp_id){
      h+=`<div class="form">`;
      if(S.err)h+=`<p class="err">${esc(S.err)}</p>`;
      if(S.editing.want==='不考虑')
        h+=`<label>不考虑的理由（必填）</label><textarea data-note placeholder="日后复议要靠它">${esc(S.editing.note||'')}</textarea>`;
      else h+=`<div class="fr"><div><label>版本号</label><input data-rel value="${esc(S.editing.release||'')}" placeholder="v2.1"></div>
        <div><label>上市日期 · 复活判定的分界</label><input data-date type="date" value="${esc(S.editing.date||'')}"></div></div>`;
      h+=`<button class="act on" data-confirm="${esc(i.opp_id)}|${S.editing.want}">确认</button>
        <button class="act" data-cancel style="margin-left:5px">取消</button></div>`;}
    h+=`</td><td class="r"><span class="bar" style="--w:${(i.evi_count/maxE*100).toFixed(0)}"><span class="n">${i.evi_count}</span></span></td>
      <td class="r n ${rec?'':'dim'}">${rec||'·'}</td>
      <td class="r"><span class="n">${i.n_eff}</span><div class="sub">${esc(i.scope||'')}</div></td>
      <td><span class="stat ${st==='待复议'?'rev':off?'off':''}">${esc(st)}</span></td></tr>`;});
  return h+`</tbody></table></div>`;
}

function viewVoices(){
  const s=DB.spus.find(x=>x.spu===S.spu), i=s.issues.find(x=>x.opp_id===S.opp);
  const vs=VOICES[S.opp]||[], st=shown(get(s.spu,i.opp_id)), rec=trend(s.spu,i.opp_id);
  const stars=vs.filter(v=>v.star!=null).map(v=>v.star);
  const avg=stars.length?(stars.reduce((a,b)=>a+b,0)/stars.length).toFixed(1):'—';
  let h=`<div class="head">${trail([{t:'老品迭代',go:'iter'},{t:s.name,go:'spu'},{t:i.leaf||'问题'}])}
    <h1 style="font-size:15px;line-height:1.4">${esc(i.title)}</h1>
    <p class="lede">${esc(i.d||'')} › ${esc(i.sub||'')}${i.leaf?' › '+esc(i.leaf):''} · ${esc(s.name)} · ${esc(st)}</p></div>
    <div class="scroll"><div class="readout">
      <div class="ro"><div class="v">${i.evi_count}</div><div class="k">条证据</div></div>
      <div class="ro"><div class="v ${rec?'':'dim'}">${rec}</div><div class="k">近60天新增</div>
        <div class="cmp">${rec?'仍在产出':'已沉寂'}</div></div>
      <div class="ro"><div class="v">${avg}</div><div class="k">原声均星</div></div>
      <div class="ro"><div class="v">${i.n_eff}</div><div class="k">有效产品数</div>
        <div class="cmp">${esc(i.scope||'')}</div></div></div>
    <div class="grp"><h2>原声</h2><span class="c">${vs.length} / ${i.evi_count}</span>
      <span class="r">问题条目就是最小分析单位，其下不再分级</span></div>`;
  if(!vs.length)h+=`<p style="font-size:12px;color:var(--ink-4);padding:12px 0">这条原型只装了主力产品前几个问题的真实原声。</p>`;
  vs.forEach(v=>{h+=`<div class="voice"><p>${esc(v.text)}</p><div class="meta">
    <span class="s">★${v.star??'—'}</span><span>${esc(v.plat||'')}</span>
    <span>${esc(v.country||'')}</span><span class="s">${esc(v.date)}</span></div></div>`;});
  return h+`</div>`;
}

function viewInno(){
  let h=`<div class="head"><h1>新品创新</h1></div>
    <div class="scroll"><div class="grp"><h2>共享池</h2><span class="c">${INNO.length}</span>
      <span class="r">按热度排序</span></div>
    <table><thead><tr><th style="width:3px"></th><th>诉求</th>
      <th class="r" style="width:70px">证据</th><th class="r" style="width:74px">互动</th>
      <th style="width:190px">对标品牌</th><th style="width:96px">状态</th></tr></thead><tbody>`;
  INNO.forEach(it=>{
    const st=shown(get('INNO',it.opp_id));
    h+=`<tr data-inno="${esc(it.opp_id)}" tabindex="0"><td class="mark"><span class="mk ${mark(st)}"></span></td>
      <td><div class="nm">${esc(it.title)}</div>
        <div class="sub"><span class="code">${esc(it.opp_id)}</span> · ${esc(it.core_tag||'')}</div></td>
      <td class="r n">${it.evi_total}</td><td class="r n dim">${fmt(it.interactions)}</td>
      <td class="sub" style="font-size:11px">${esc((it.brands||[]).slice(0,4).join(' · ')||'—')}</td>
      <td><span class="stat ${isOff(st)?'off':''}">${esc(st)}</span></td></tr>`;});
  return h+`</tbody></table></div>`;
}

function viewInnoDetail(){
  const it=INNO.find(x=>x.opp_id===S.opp), st=shown(get('INNO',it.opp_id));
  let h=`<div class="head">${trail([{t:'新品创新',go:'inno'},{t:it.title.slice(0,18)}])}
    <h1 style="font-size:15px;line-height:1.4">${esc(it.title)}</h1>
    <p class="lede"><span class="code">${esc(it.opp_id)}</span> · ${esc(it.core_tag||'')} · ${esc(it.first_week)}–${esc(it.last_week)}</p></div>
    <div class="scroll"><div class="readout">
      <div class="ro"><div class="v">${it.evi_total}</div><div class="k">条证据</div><div class="cmp">全部来自社媒</div></div>
      <div class="ro"><div class="v">${fmt(it.interactions)}</div><div class="k">互动合计</div><div class="cmp">证据聚合而来</div></div>
      <div class="ro"><div class="v">${it.tagged}/${it.attached}</div><div class="k">标签覆盖</div></div>
      <div class="ro"><div class="v">${(it.brands||[]).length}</div><div class="k">对标品牌</div></div></div>`;
  [['现象','phenomenon'],['归因','attribution'],['建议 · 市面缺口','suggestion']].forEach(([k,f])=>{
    if(it[f])h+=`<div class="grp"><h2>${k}</h2></div><p style="font-size:12.5px;line-height:1.7;color:var(--ink-2);margin:0;max-width:64em">${esc(it[f])}</p>`;});
  if(it.quotes&&it.quotes.length){
    h+=`<div class="grp"><h2>灵感来源</h2><span class="c">${it.quotes.length} / ${it.evi_total}</span></div>`;
    it.quotes.forEach(q=>{h+=`<div class="voice"><p>${esc(q.text)}</p><div class="meta">
      <span>${esc(q.plat||'')}</span><span class="s">互动 ${fmt(q.act)}</span><span class="s">${esc(q.date)}</span></div></div>`;});}
  h+=`<div class="grp"><h2>对标品牌</h2></div>
    <p style="font-size:12.5px;color:var(--ink-2);margin:0">${esc((it.brands||[]).join(' · ')||'—')}</p>
    <div class="ops" style="margin-top:22px"><span class="lbl">状态</span>`;
  FLOW.forEach(f=>{const m=get('INNO',it.opp_id),gr=(f==='不考虑'||f==='已完成');
    h+=`<button class="act ${m.status===f?'on':''} ${gr&&m.status!==f?'grave':''}" data-iset="${esc(it.opp_id)}|${f}">${f}</button>`;});
  return h+`</div></div>`;
}

function viewStrategy(){
  const list=DB.strategy.filter(x=>S.scope==='全部'||x.scope===S.scope);
  const maxS=Math.max(...DB.strategy.map(x=>x.spus||0),1);
  let h=`<div class="head"><h1>战略视图</h1>
    <div class="tabs">`;
  ['品线级','多品','单品','全部'].forEach(x=>{const n=x==='全部'?DB.strategy.length:DB.strategy.filter(s=>s.scope===x).length;
    h+=`<button class="tab ${S.scope===x?'on':''}" data-scope="${x}">${x} <span class="n">${n}</span></button>`;});
  h+=`</div></div><div class="scroll"><table><thead><tr><th>共性问题</th>
    <th class="r" style="width:150px">涉及 SPU</th><th class="r" style="width:78px">集中度</th>
    <th class="r" style="width:70px">证据</th></tr></thead><tbody>`;
  list.forEach(x=>{h+=`<tr><td><div class="nm">${esc(x.title)}</div>
    <div class="sub">${esc(x.prod_line||'')} · ${esc(x.scope)}</div></td>
    <td class="r"><span class="bar" style="--w:${((x.spus||0)/maxS*100).toFixed(0)}"><span class="n-lg">${x.spus}</span></span></td>
    <td class="r n dim">${x.n_eff}</td><td class="r n dim">${x.evi_total}</td></tr>`;});
  return h+`</tbody></table></div>`;
}

function viewSearch(){
  let list=DB.spus.filter(s=>{
    if(S.q&&!((s.spu+s.name+(s.skus||[]).join()).toLowerCase().includes(S.q.toLowerCase())))return false;
    if(S.cat&&s.category!==S.cat)return false;return true;});
  list=[...list].sort((a,b)=>ratio(b)-ratio(a));
  const maxNeg=Math.max(...DB.spus.map(s=>s.negative_evi_count));
  let h=`<div class="head"><h1>产品检索</h1></div>
    <div class="scroll"><div class="search"><span class="dim">/</span>
      <input id="q" placeholder="SPU 编号、品名、SKU" value="${esc(S.q)}"></div>
    <div class="filters"><button class="f ${!S.cat?'on':''}" data-cat="">全部<span class="n2">${DB.facets.total}</span></button>`;
  Object.entries(DB.facets.category).forEach(([k,v])=>{
    h+=`<button class="f ${S.cat===k?'on':''}" data-cat="${esc(k)}">${esc(k)}<span class="n2">${v}</span></button>`;});
  h+=`<span style="margin-left:auto;font-size:11px;color:var(--ink-4)">标签树筛选需接后端，原型内置 ${DB.spus.length} 个真实 SPU</span></div>
    <table><thead><tr><th>产品</th><th style="width:44px">定级</th>
      <th class="r" style="width:78px">负面占比</th><th class="r" style="width:84px">负面证据</th>
      <th class="r" style="width:52px">均星</th><th class="r" style="width:62px">待办/总</th></tr></thead><tbody>`;
  list.forEach(s=>{const r=ratio(s),hot=r>=20;
    h+=`<tr data-spu="${esc(s.spu)}" tabindex="0"><td><div class="nm">${esc(s.name)}</div>
      <div class="sub"><span class="code">${esc(s.spu)}</span> · ${esc(s.category||'')} · ${esc(s.launch_period||'—')}</div></td>
      <td class="n dim">${esc((s.grade||'').replace('级',''))}</td>
      <td class="r"><span class="n-lg" style="${hot?'color:var(--alarm)':''}">${r.toFixed(1)}</span></td>
      <td class="r"><span class="bar ${hot?'hot':''}" style="--w:${(s.negative_evi_count/maxNeg*100).toFixed(0)}"><span class="n">${fmt(s.negative_evi_count)}</span></span></td>
      <td class="r n dim">${s.avg_star}</td><td class="r n dim">${backlog(s)}</td></tr>`;});
  if(!list.length)h+=`<tr><td colspan="6" style="padding:20px;text-align:center;color:var(--ink-4)">没有匹配的产品</td></tr>`;
  return h+'</tbody></table></div>';
}

// ---------- 渲染 ----------
function render(){
  const v=document.getElementById('view');
  v.innerHTML=S.view==='spu'?viewSpu():S.view==='voices'?viewVoices()
    :S.view==='inno'?viewInno():S.view==='innod'?viewInnoDetail()
    :S.view==='strategy'?viewStrategy():S.view==='search'?viewSearch():viewIter();
  const revCount=DB.spus.reduce((n,s)=>n+s.issues.filter(i=>shown(get(s.spu,i.opp_id))==='待复议').length,0);
  document.getElementById('c-iter').textContent=DB.spus.length;
  document.getElementById('c-inno').textContent=INNO.length;
  document.getElementById('c-str').textContent=DB.strategy.filter(s=>s.scope==='品线级').length;
  document.getElementById('c-search').textContent=DB.facets.total;
  const it=document.querySelector('[data-go="iter"]');
  it.classList.toggle('alarm',revCount>0);
  if(revCount>0)document.getElementById('c-iter').textContent=DB.spus.length+' · '+revCount+'⟳';
  document.querySelectorAll('.nav[data-go]').forEach(b=>{
    const grp=S.view==='spu'||S.view==='voices'?'iter':S.view==='innod'?'inno':S.view;
    b.classList.toggle('on',b.dataset.go===grp);});
  bind();
}

function bind(){
  const v=document.getElementById('view');
  const on=(sel,fn)=>v.querySelectorAll(sel).forEach(el=>el.onclick=e=>fn(el,e));
  on('[data-spu]',el=>go('spu',el.dataset.spu));
  on('[data-inno]',el=>go('innod',null,el.dataset.inno));
  on('[data-voices]',(el,e)=>{e.stopPropagation();go('voices',S.spu,el.dataset.voices);});
  on('[data-trail]',el=>go(el.dataset.trail,S.spu));
  on('[data-scope]',el=>{S.scope=el.dataset.scope;render();});
  on('[data-cat]',el=>{S.cat=el.dataset.cat||null;render();});
  on('[data-rev]',(el,e)=>{e.stopPropagation();revive(S.spu,el.dataset.rev);});
  on('[data-set]',(el,e)=>{e.stopPropagation();const [o,st]=el.dataset.set.split('|');
    if((st==='不考虑'||st==='已完成')&&!(S.editing&&S.editing.opp===o&&S.editing.want===st)){
      S.editing={spu:S.spu,opp:o,want:st};S.err=null;return render();}
    setStatus(S.spu,o,st);});
  on('[data-iset]',(el,e)=>{e.stopPropagation();const [o,st]=el.dataset.iset.split('|');
    const m={...get('INNO',o)};m.status=st;manual[key('INNO',o)]=m;toast('→ '+st);render();});
  on('[data-confirm]',(el,e)=>{e.stopPropagation();const f=el.closest('.form');
    const n=f.querySelector('[data-note]'),r=f.querySelector('[data-rel]'),d=f.querySelector('[data-date]');
    if(n)S.editing.note=n.value; if(r)S.editing.release=r.value; if(d)S.editing.date=d.value;
    const [o,st]=el.dataset.confirm.split('|');setStatus(S.spu,o,st);});
  on('[data-cancel]',(el,e)=>{e.stopPropagation();S.editing=null;S.err=null;render();});
  const q=v.querySelector('#q');
  if(q)q.oninput=()=>{const p=q.selectionStart;S.q=q.value;render();
    const n=document.querySelector('#q');if(n){n.focus();n.setSelectionRange(p,p);}};
}

// 键盘：对每周重复使用的工具，这项的实际收益高于所有视觉改动之和
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  const rows=[...document.querySelectorAll('tbody tr[tabindex]')];
  if(e.key==='j'||e.key==='k'){
    if(!rows.length)return; e.preventDefault();
    S.cur=Math.max(0,Math.min(rows.length-1,S.cur+(e.key==='j'?1:-1)));
    rows.forEach((r,i)=>r.classList.toggle('sel',i===S.cur));
    rows[S.cur].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){ if(rows[S.cur])rows[S.cur].click(); }
  else if(e.key==='Escape'){
    if(S.editing){S.editing=null;S.err=null;render();}
    else if(S.view==='voices')go('spu',S.spu);
    else if(S.view==='spu')go('iter');
    else if(S.view==='innod')go('inno');}
});
document.querySelectorAll('.nav[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
render();
</script>
