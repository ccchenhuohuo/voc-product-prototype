[project]
name = "voc-analytics"
version = "0.0.1"
description = "VOC 数据管道（云听 CEM → PostgreSQL → Dagster）"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "openpyxl>=3.1",
  "dagster>=1.7",
  "dagster-webserver>=1.7",
  "dagster-postgres>=0.23",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voc_analytics"]
